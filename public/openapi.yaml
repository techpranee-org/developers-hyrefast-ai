  # ── 14. Create Webhook ────────────────────────
  /external/api/v1/webhook-subscription/create:
    post:
      operationId: createWebhook
      tags: [Webhooks]
      summary: Register a webhook
      description: |
        Registers your webhook URL for the workspace. A workspace may register only one — a second
        attempt while one is already active is rejected. See the Webhooks section above for the event
        list, payload shape, and how to verify the signature.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWebhookRequest'
            examples:
              example:
                value:
                  name: Production ATS sync
                  url: https://api.yourats.com/hooks/hyrefast
      responses:
        '200':
          description: Webhook registered successfully. `secret` is returned only here.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/WebhookCreateData'
              examples:
                success:
                  value:
                    status: SUCCESS
                    message: Your request is successfully executed
                    data:
                      id: whk_qrs321
                      name: Production ATS sync
                      url: https://api.yourats.com/hooks/hyrefast
                      status: active
                      secret: whsec_5f3a9c1e8b2d4f6a7c0e1b3d5f7a9c1e8b2d4f6a7c0e1b3d5f7a9c1e8b2d4f6a
                      lastTriggeredAt: null
                      createdAt: 2026-08-01T10:00:00Z
        '422':
          description: Validation error — missing/invalid `name` or `url`, or your workspace already has a registered webhook.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorEnvelope'
              examples:
                already_registered:
                  value:
                    status: VALIDATION_ERROR
                    message: This workspace already has a webhook set up. All supported events are sent to it. Please update the existing webhook or delete it before creating a new one.
                    data: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'
      x-codeSamples:
        - lang: cURL
          source: |
            curl -X POST "https://api.hyrefast.ai/external/api/v1/webhook-subscription/create" \
              -H "X-API-Key: YOUR_API_KEY" \
              -H "Content-Type: application/json" \
              -d '{ "name": "Production ATS sync", "url": "https://api.yourats.com/hooks/hyrefast" }'
        - lang: JavaScript
          source: |
            const response = await fetch(`${BASE_URL}/external/api/v1/webhook-subscription/create`, {
              method: 'POST',
              headers: {
                'X-API-Key': API_KEY,
                'Content-Type': 'application/json',
              },
              body: JSON.stringify({
                name: 'Production ATS sync',
                url: 'https://api.yourats.com/hooks/hyrefast',
              }),
            });
            const { data } = await response.json();
            // Store data.secret now - it is not shown again.
        - lang: Python
          source: |
            import requests

            response = requests.post(
                f"{BASE_URL}/external/api/v1/webhook-subscription/create",
                headers={"X-API-Key": API_KEY},
                json={"name": "Production ATS sync", "url": "https://api.yourats.com/hooks/hyrefast"},
            )
            data = response.json()["data"]
            # Store data["secret"] now - it is not shown again.

