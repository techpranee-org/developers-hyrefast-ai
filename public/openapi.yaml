                  job: job_abc123
                  email: john@example.com
                  name: John Doe
                  number: '+919876543210'
                  resume: ''
              with_resume:
                summary: With a resume attached
                description: |
                  Upload the resume file first via `POST /documents/upload` (`type: "resume"`), then pass
                  the returned URL as `resume` here.
                value:
                  job: job_abc123
                  email: john@example.com
                  name: John Doe
                  number: '+919876543210'
                  resume: https://your-bucket.s3.amazonaws.com/workspaces/w1/external-uploads/resumes/1699999999-d4e5f6.pdf
      responses:
