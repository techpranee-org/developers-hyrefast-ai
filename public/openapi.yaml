                    message: Your request is successfully executed
                    data:
                      jobId: 5e6f7a8b-9c0d-4e1f-8a2b-3c4d5e6f7a8b
                      status: queued
                      stage: queued
                      message: Queued AI Labs config run for analysis.topics.
                      pollAfterMs: 2000
                      error: null
                      result: null
                      createdAt: 2026-08-01T10:00:00Z
                      startedAt: null
                      completedAt: null
        '404':
          description: The referenced generation `jobId` doesn't exist, or has expired (runs are retained for 30 minutes after completion).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundEnvelope'
        '403':
          description: The referenced generation run belongs to a different workspace than your API key's.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
