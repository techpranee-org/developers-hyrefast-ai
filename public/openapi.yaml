  # ── 9. List Applications ──────────────────────
  /external/api/v1/applications/list:
    post:
      operationId: listApplications
      tags: [Applications]
      summary: List applications
      description: |
        Paginated list of applications owned by your workspace, most recent first. Filterable only by
        `name` and `_id` — any other field in `query` is rejected with `422`. Always scoped to your
        workspace; if `query` is omitted, every application in your workspace is returned.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListApplicationsRequestBody'
            examples:
              search_by_name:
                summary: Search by candidate name
                value:
                  query: { name: John }
                  options: { page: 1, limit: 20 }
              filter_by_id:
                summary: Filter to a single application
                value:
                  query: { _id: app_xyz789 }
      responses:
        '200':
          description: |
            Applications matched, or an empty result. `data` is an `ApplicationListData` object when
            applications are found, a `CountOnlyData` object (`{ "totalRecords": N }`) when
            `isCountOnly: true`, or `null` (with `status: RECORD_NOT_FOUND`) when the query matches nothing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
              examples:
                success:
                  value:
                    status: SUCCESS
                    message: Your request is successfully executed
                    data:
                      data:
                        - id: app_xyz789
                          job:
                            { id: job_abc123, title: Senior Python Developer }
                          candidate: { name: John Doe, email: john@example.com }
                          status: interview_link_not_sent
                      currentPage: 1
                      perPage: 20
                      itemCount: 1
                      pageCount: 1
                empty:
                  summary: No applications matched the query
                  value:
                    status: RECORD_NOT_FOUND
                    message: recordNotFound
                    data: null
        '422':
          description: Validation error — invalid `query` or `options` field.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'
      x-codeSamples:
        - lang: cURL
          source: |
            curl -X POST "https://api.hyrefast.ai/external/api/v1/applications/list" \
              -H "X-API-Key: YOUR_API_KEY" \
              -H "Content-Type: application/json" \
              -d '{ "query": { "name": "John" }, "options": { "page": 1, "limit": 20 } }'
        - lang: JavaScript
          source: |
            const response = await fetch(`${BASE_URL}/external/api/v1/applications/list`, {
              method: 'POST',
              headers: {
                'X-API-Key': API_KEY,
                'Content-Type': 'application/json',
              },
              body: JSON.stringify({
                query: { name: 'John' },
                options: { page: 1, limit: 20 },
              }),
            });
            const { data } = await response.json();
        - lang: Python
          source: |
            import requests

            response = requests.post(
                f"{BASE_URL}/external/api/v1/applications/list",
                headers={"X-API-Key": API_KEY},
                json={"query": {"name": "John"}, "options": {"page": 1, "limit": 20}},
            )
            data = response.json()["data"]

