  # ── 4a. Generate Job Skills ───────────────────
  /external/api/v1/jobs/{jobId}/skills/generate:
    post:
      operationId: generateJobSkills
      tags: [Skills]
      summary: Generate skills
      description: |
        Triggers Hyrefast's automatic skill-generation AI to extract must-have / good-to-have / bonus
        skills for this job from its title and description — the same engine behind the skills suggestions
        in the Hyrefast app. This is a **separate action from `PUT /jobs/{jobId}/skills`**: that endpoint
        sets skills you provide yourself; this one generates them and writes the result to the job's
        `jd_structured_skills` automatically, overwriting whatever was there before.

        Generation runs asynchronously and typically takes anywhere from several seconds to a couple of
        minutes. This call returns immediately with a `jobId` identifying the run — poll
        [`GET /jobs/skills/generate/status/{jobId}`](#tag/Skills/operation/getJobSkillsGenerationStatus) with
        it to check progress and retrieve the result once it succeeds.
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: Skill generation started.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SkillsGenerationJob'
              examples:
                success:
                  value:
                    status: SUCCESS
                    message: Your request is successfully executed
                    data:
                      jobId: 8f14e45f-ceea-467e-bd3f-e0e3e4a5b7c1
                      status: queued
                      pollAfterMs: 2000
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'
      x-codeSamples:
        - lang: cURL
          source: |
            curl -X POST "https://api.hyrefast.ai/external/api/v1/jobs/job_abc123/skills/generate" \
              -H "X-API-Key: YOUR_API_KEY"
        - lang: JavaScript
          source: |
            const response = await fetch(
              `${BASE_URL}/external/api/v1/jobs/${JOB_ID}/skills/generate`,
              {
                method: 'POST',
                headers: { 'X-API-Key': API_KEY },
              },
            );
            const { data } = await response.json();
            // data.jobId -> poll GET /jobs/skills/generate/status/{jobId}
        - lang: Python
          source: |
            import requests

            response = requests.post(
                f"{BASE_URL}/external/api/v1/jobs/{JOB_ID}/skills/generate",
                headers={"X-API-Key": API_KEY},
            )
            data = response.json()["data"]
            # data["jobId"] -> poll GET /jobs/skills/generate/status/{jobId}

  # ── 4b. Get Job Skills Generation Status ──────
  /external/api/v1/jobs/skills/generate/status/{jobId}:
    get:
      operationId: getJobSkillsGenerationStatus
      tags: [Skills]
      summary: Get skills generation status
      description: |
        Polls the status of a skill-generation run started by
        [`POST /jobs/{jobId}/skills/generate`](#tag/Skills/operation/generateJobSkills). Use the returned
        `pollAfterMs` as the delay before your next poll.
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
          description: |
            ID of the generation run, as returned in `jobId` by `POST /jobs/{jobId}/skills/generate` —
            not the job's own ID.
          example: 8f14e45f-ceea-467e-bd3f-e0e3e4a5b7c1
      responses:
        '200':
          description: Current status of the generation run.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SkillsGenerationStatus'
              examples:
                succeeded:
                  summary: Succeeded
                  value:
                    status: SUCCESS
                    message: Your request is successfully executed
                    data:
                      jobId: 8f14e45f-ceea-467e-bd3f-e0e3e4a5b7c1
                      status: succeeded
                      stage: completed
                      message: Skill extraction completed.
                      pollAfterMs: 2000
                      error: null
                      result:
                        jobId: job_abc123
                        job_title: Senior Python Developer
                        structured_extraction:
                          must_have_skills:
                            - skill_name: Python
                              proficiency: L4
                          good_to_have_skills:
                            - skill_name: AWS
                              proficiency: L2
                          bonus_skills: []
                        skillsSavedAt: 2026-08-01T10:02:30Z
                      createdAt: 2026-08-01T10:00:00Z
                      startedAt: 2026-08-01T10:00:01Z
                      completedAt: 2026-08-01T10:02:30Z
                queued:
                  summary: Still queued
                  value:
                    status: SUCCESS
                    message: Your request is successfully executed
                    data:
                      jobId: 8f14e45f-ceea-467e-bd3f-e0e3e4a5b7c1
                      status: queued
                      stage: queued
                      message: Queued for skill extraction.
                      pollAfterMs: 2000
                      error: null
                      result: null
                      createdAt: 2026-08-01T10:00:00Z
                      startedAt: null
                      completedAt: null
        '404':
          description: The referenced generation `jobId` doesn't exist, or has expired (runs are retained for 30 minutes after completion).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundEnvelope'
        '403':
          description: The referenced generation run belongs to a different workspace than your API key's.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'
      x-codeSamples:
        - lang: cURL
          source: |
            curl -X GET "https://api.hyrefast.ai/external/api/v1/jobs/skills/generate/status/8f14e45f-ceea-467e-bd3f-e0e3e4a5b7c1" \
              -H "X-API-Key: YOUR_API_KEY"
        - lang: JavaScript
          source: |
            const response = await fetch(
              `${BASE_URL}/external/api/v1/jobs/skills/generate/status/${RUN_ID}`,
              { headers: { 'X-API-Key': API_KEY } },
            );
            const { data } = await response.json();
        - lang: Python
          source: |
            import requests

            response = requests.get(
                f"{BASE_URL}/external/api/v1/jobs/skills/generate/status/{RUN_ID}",
                headers={"X-API-Key": API_KEY},
            )
            data = response.json()["data"]

