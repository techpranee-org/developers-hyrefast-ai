  # ── 6a. Enable Job Conversation Mode ──────────
  /external/api/v1/jobs/{jobId}/conversation-mode/enable:
    post:
      operationId: enableJobConversationMode
      tags: [Conversation Mode]
      summary: Enable conversation mode
      description: |
        Enables conversation-mode interviews for a job. Validates the job has at least one topic
        configured first (`topics.topicToFocusIds`, via
        [`PUT /jobs/{jobId}/topics`](#tag/Topics/operation/updateJobTopics) or
        [`POST /jobs/{jobId}/topics/generate`](#tag/Topics/operation/generateJobTopics)) — conversation mode
        has nothing to hold a discussion around otherwise. If none are configured, returns `422` instead
        of enabling.

        This is a separate action from
        [disabling conversation mode](#tag/Conversation-Mode/operation/disableJobConversationMode) rather than a single
        toggle, since only enabling carries this validation.
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: Conversation mode enabled successfully.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/JobConversationModeData'
              examples:
                success:
                  value:
                    status: SUCCESS
                    message: Conversation mode enabled successfully.
                    data:
                      id: job_abc123
                      interviewModes:
                        standard: true
                        conversation: true
        '400':
          description: Conversation mode is already enabled.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: BAD_REQUEST
                  message:
                    type: string
                    example: Conversation mode is already enabled.
                  data:
                    example: null
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Job is missing required information — `message` lists what's missing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorEnvelope'
              examples:
                missing_topics:
                  value:
                    status: VALIDATION_ERROR
                    message: 'Job is not eligible for conversation mode. Missing or invalid: topics - at least one topic (PUT /jobs/:id/topics or POST /jobs/:id/topics/generate).'
                    data: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'
      x-codeSamples:
        - lang: cURL
          source: |
            curl -X POST "https://api.hyrefast.ai/external/api/v1/jobs/job_abc123/conversation-mode/enable" \
              -H "X-API-Key: YOUR_API_KEY"
        - lang: JavaScript
          source: |
