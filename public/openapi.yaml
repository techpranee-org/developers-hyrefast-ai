  /external/api/v1/applications/{applicationId}/responses/list:
    post:
      operationId: listResponses
      tags: [Responses]
      summary: List responses
      description: |
        Paginated list of interview responses (one per interview question) for an application in your
        workspace, ordered by `questionNumber`. Each item includes the transcript and time-limited signed
        URLs for the recorded audio/video.

        Transcription runs asynchronously and can still be in progress after the interview itself is
        complete — poll this endpoint until each item's `transcriptionStatus` reaches `completed` (there
        is currently no webhook event for transcription completion). `audioUrl`/`videoUrl` are presigned
        and expire after 1 hour, so re-fetch this endpoint rather than caching them.
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListResponsesRequestBody'
            examples:
              paginated:
                value:
                  options: { page: 1, limit: 20 }
      responses:
        '200':
          description: |
            Responses matched, or an empty result. `data` is a `ResponseListData` object when responses
            are found, or `null` (with `status: RECORD_NOT_FOUND`) when the application has none yet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
              examples:
                success:
                  value:
                    status: SUCCESS
                    message: Your request is successfully executed
                    data:
                      data:
                        - id: rsp_ghi012
                          questionNumber: 1
                          questionText: Describe a time you optimized a slow query.
                          responseText: ''
                          transcriptionStatus: completed
                          transcriptionMethod: whisper
                          transcriptionText: So there was this one time where the query was taking...
                          responseDuration: 42.5
                          durations:
                            video_duration: 42.5
                            audio_duration: 42.5
                            response_latency: 1.2
                            response_onset_latency: 0.8
                          audioUrl: https://your-bucket.s3.amazonaws.com/workspaces/w1/.../audio/final.webm?X-Amz-Signature=...
                          videoUrl: https://your-bucket.s3.amazonaws.com/workspaces/w1/.../video/final.webm?X-Amz-Signature=...
                          isSkipped: false
                          createdAt: 2026-08-20T10:15:00Z
                          updatedAt: 2026-08-20T10:16:30Z
                      currentPage: 1
                      perPage: 20
                      itemCount: 1
                      pageCount: 1
                pending_transcription:
                  summary: Transcription still in progress
                  value:
                    status: SUCCESS
                    message: Your request is successfully executed
                    data:
                      data:
                        - id: rsp_ghi012
                          questionNumber: 1
                          questionText: Describe a time you optimized a slow query.
                          responseText: ''
                          transcriptionStatus: processing
                          transcriptionMethod: null
                          transcriptionText: null
                          responseDuration: 42.5
                          audioUrl: https://your-bucket.s3.amazonaws.com/workspaces/w1/.../audio/final.webm?X-Amz-Signature=...
                          videoUrl: https://your-bucket.s3.amazonaws.com/workspaces/w1/.../video/final.webm?X-Amz-Signature=...
                          isSkipped: false
                      currentPage: 1
                      perPage: 20
                      itemCount: 1
                      pageCount: 1
                empty:
                  summary: No responses submitted yet for this application
                  value:
                    status: RECORD_NOT_FOUND
                    message: recordNotFound
                    data: null
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'
      x-codeSamples:
        - lang: cURL
          source: |
            curl -X POST "https://api.hyrefast.ai/external/api/v1/applications/app_xyz789/responses/list" \
              -H "X-API-Key: YOUR_API_KEY" \
              -H "Content-Type: application/json" \
              -d '{ "options": { "page": 1, "limit": 20 } }'
        - lang: JavaScript
          source: |
            const response = await fetch(
              `${BASE_URL}/external/api/v1/applications/${APPLICATION_ID}/responses/list`,
              {
                method: 'POST',
                headers: { 'X-API-Key': API_KEY, 'Content-Type': 'application/json' },
                body: JSON.stringify({ options: { page: 1, limit: 20 } }),
              },
            );
            const { data } = await response.json();
        - lang: Python
          source: |
            import requests

            response = requests.post(
                f"{BASE_URL}/external/api/v1/applications/{APPLICATION_ID}/responses/list",
                headers={"X-API-Key": API_KEY},
                json={"options": {"page": 1, "limit": 20}},
            )
            data = response.json()["data"]
