  # ── 2. List Jobs ──────────────────────────────
  /external/api/v1/jobs/list:
    post:
      operationId: listJobs
      tags: [Job Management]
      summary: List jobs
      description: |
        Paginated list of jobs owned by your workspace, most recent first. Filterable only by `status`,
        `title`, and `_id` — any other field in `query` is rejected with `422`. Always scoped to your
        workspace; if `query` is omitted, every job in your workspace is returned.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListJobsRequestBody'
            examples:
              filtered:
                summary: Filter by status, paginate
                value:
                  query: { status: draft }
                  options: { page: 1, limit: 20 }
              search_by_title:
                summary: Search by title
                value:
                  query: { title: Python Developer }
                  options: { page: 1, limit: 20 }
              count_only:
                summary: Count only
                value:
                  query: { status: published }
                  isCountOnly: true
      responses:
        '200':
          description: |
            Jobs matched, or an empty result. `data` is a `JobListData` object when jobs are found,
            a `CountOnlyData` object (`{ "totalRecords": N }`) when `isCountOnly: true`, or `null`
            (with `status: RECORD_NOT_FOUND`) when the query matches nothing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
              examples:
                success:
                  value:
                    status: SUCCESS
                    message: Your request is successfully executed
                    data:
                      data:
                        - id: job_abc123
                          title: Senior Python Developer
                          publicationStatus: draft
                          status: draft
                      currentPage: 1
                      perPage: 20
                      itemCount: 1
                      pageCount: 1
                empty:
                  summary: No jobs matched the query
                  value:
                    status: RECORD_NOT_FOUND
                    message: recordNotFound
                    data: null
        '422':
          description: Validation error — invalid `query` or `options` field.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'
      x-codeSamples:
        - lang: cURL
          source: |
            curl -X POST "https://api.hyrefast.ai/external/api/v1/jobs/list" \
              -H "X-API-Key: YOUR_API_KEY" \
              -H "Content-Type: application/json" \
              -d '{ "query": { "status": "draft" }, "options": { "page": 1, "limit": 20 } }'
        - lang: JavaScript
          source: |
            const response = await fetch(`${BASE_URL}/external/api/v1/jobs/list`, {
              method: 'POST',
              headers: {
                'X-API-Key': API_KEY,
                'Content-Type': 'application/json',
              },
              body: JSON.stringify({
                query: { status: 'draft' },
                options: { page: 1, limit: 20 },
              }),
            });
            const { data } = await response.json();
        - lang: Python
          source: |
            import requests

            response = requests.post(
                f"{BASE_URL}/external/api/v1/jobs/list",
                headers={"X-API-Key": API_KEY},
                json={
                    "query": {"status": "draft"},
                    "options": {"page": 1, "limit": 20},
                },
            )
            data = response.json()["data"]

