        is normalized server-side into `topicsToFocus` items shaped exactly like
        [`PUT /jobs/{jobId}/topics`](#tag/Topics/operation/updateJobTopics) expects — no client-side parsing
        needed.
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
          description: |
            ID of the generation run, as returned in `jobId` by `POST /jobs/{jobId}/topics/generate` — not
            the job's own ID.
          example: 5e6f7a8b-9c0d-4e1f-8a2b-3c4d5e6f7a8b
      responses:
        '200':
          description: Current status of the generation run.
          content:
