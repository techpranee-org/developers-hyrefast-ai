            data = response.json()["data"]

  # ── 5b1. Generate Job Topics ──────────────────
  /external/api/v1/jobs/{jobId}/topics/generate:
    post:
      operationId: generateJobTopics
      tags: [Topics]
      summary: Generate topics
      description: |
        Triggers Hyrefast's automatic topic-generation AI, clustering this job's accepted skills (from
        `PUT /jobs/{jobId}/skills` or
        [`POST /jobs/{jobId}/skills/generate`](#tag/Skills/operation/generateJobSkills)) into logical interview
        discussion topics.

        Like question generation, this is **generation-only** — the result is not written back to the job
        automatically. To keep the generated topics, pass them to
        [`PUT /jobs/{jobId}/topics`](#tag/Topics/operation/updateJobTopics) yourself once generation succeeds.

        Generation runs asynchronously and typically takes anywhere from several seconds to a couple of
        minutes. This call returns immediately with a `jobId` identifying the run — poll
        [`GET /jobs/topics/generate/status/{jobId}`](#tag/Topics/operation/getJobTopicsGenerationStatus) with
        it to check progress and retrieve the result once it succeeds.
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: Topic generation started.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/TopicsGenerationJob'
              examples:
                success:
                  value:
                    status: SUCCESS
                    message: Your request is successfully executed
                    data:
                      jobId: 5e6f7a8b-9c0d-4e1f-8a2b-3c4d5e6f7a8b
                      status: queued
                      pollAfterMs: 2000
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'
      x-codeSamples:
        - lang: cURL
          source: |
            curl -X POST "https://api.hyrefast.ai/external/api/v1/jobs/job_abc123/topics/generate" \
              -H "X-API-Key: YOUR_API_KEY"
        - lang: JavaScript
          source: |
            const response = await fetch(
              `${BASE_URL}/external/api/v1/jobs/${JOB_ID}/topics/generate`,
              {
                method: 'POST',
                headers: { 'X-API-Key': API_KEY },
              },
            );
            const { data } = await response.json();
            // data.jobId -> poll GET /jobs/topics/generate/status/{jobId}
        - lang: Python
          source: |
            import requests

            response = requests.post(
                f"{BASE_URL}/external/api/v1/jobs/{JOB_ID}/topics/generate",
                headers={"X-API-Key": API_KEY},
            )
            data = response.json()["data"]
            # data["jobId"] -> poll GET /jobs/topics/generate/status/{jobId}

