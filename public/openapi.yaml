openapi: 3.1.0
info:
  title: Hyrefast API
  version: 1.0.0
  summary: Integration API for external clients to create jobs, submit candidate applications, and manage interview invitations in Hyrefast.
  description: |
    The Hyrefast API lets your application create jobs, submit candidate applications, and manage interview
    invitations inside your Hyrefast workspace programmatically — without using the Hyrefast dashboard.

    It's designed for server-to-server integrations: ATS platforms, career sites, and recruiting tools
    that need to push jobs and candidates into Hyrefast and trigger interview delivery.

    All requests are authenticated with a single API key and return a consistent JSON response envelope.
  contact:
    name: Hyrefast Support
    email: support@hyrefast.ai
    url: https://hyrefast.ai
  license:
    name: Proprietary
    url: https://hyrefast.ai/terms

servers:
  - url: https://staging-api.hyrefast.ai
    description: Staging — use for testing your integration before going live
  - url: https://api.hyrefast.ai
    description: Production

# ─────────────────────────────────────────────
# Security
# ─────────────────────────────────────────────
security:
  - ApiKeyAuth: []

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: Your workspace API key. Generate one from the Hyrefast dashboard under Settings → API Keys → Generate API Key.

  # ─────────────────────────────────────────────
  # Reusable parameters
  # ─────────────────────────────────────────────
  parameters:
    JobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string
      description: ID of a job belonging to your workspace.
      example: job_abc123
    ApplicationId:
      name: applicationId
      in: path
      required: true
      schema:
        type: string
      description: ID of an application belonging to your workspace.
      example: app_xyz789
    WebhookId:
      name: webhookId
      in: path
      required: true
      schema:
        type: string
      description: ID of the webhook registered for your workspace.
      example: whk_qrs321

  # ─────────────────────────────────────────────
  # Response envelope schemas
  # ─────────────────────────────────────────────
  schemas:
    SuccessEnvelope:
      type: object
      required: [status, message, data]
      properties:
        status:
          type: string
          example: SUCCESS
          description: Always `"SUCCESS"` on a successful request.
        message:
          type: string
          example: Your request is successfully executed
        data:
          description: The response payload. Untyped — accepts any JSON value, including `null`.

    RecordNotFoundEnvelope:
      type: object
      required: [status, message, data]
      properties:
        status:
          type: string
          example: RECORD_NOT_FOUND
          description: |
            Returned as `HTTP 200` on list endpoints when the query matches no records.
            Always check the `status` field in the body, not just the HTTP status code.
        message:
          type: string
          example: recordNotFound
        data:
          example: null

    NotFoundEnvelope:
      type: object
      required: [status, message, data]
      properties:
        status:
          type: string
          example: NOT_FOUND
          description: |
            Returned as a real `HTTP 404` on single-resource endpoints (get/update/delete by ID,
            skills, interview config, publish, send/generate interview link) — the referenced
            `jobId`/`applicationId` doesn't exist or isn't part of your workspace.
        message:
          type: string
          example: Job not found
        data:
          example: null

    ValidationErrorEnvelope:
      type: object
      required: [status, message, data]
      properties:
        status:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string
          example: jobId is required
        data:
          example: null

    UnauthorizedEnvelope:
      type: object
      required: [status, message, data]
      properties:
        status:
          type: string
          example: UNAUTHORIZED
        message:
          type: string
          example: Missing, invalid, revoked, or expired API key
        data:
          example: null

    RateLimitEnvelope:
      type: object
      required: [status, message, data]
      properties:
        status:
          type: string
          example: RATE_LIMIT_EXCEEDED
        message:
          type: string
          example: Too many requests
        data:
          example: null

    # ── Shared building blocks ──────────────────

    ListJobsRequestBody:
      type: object
      description: |
        `options` controls pagination/sorting. Every query is scoped to your workspace regardless of what
        you send — you cannot read another workspace's data through this endpoint.
      properties:
        query:
          type: object
          description: |
            Filter object. Only `status`, `title`, and `_id` are accepted — any other field is rejected
            with `422`.
          properties:
            status:
              description: Exact match against a single status, or an array to match any of several.
              oneOf:
                - type: string
                - type: array
                  items:
                    type: string
              example: draft
            title:
              type: string
              description: Case-insensitive substring match against the job title.
              example: Python Developer
            _id:
              description: Exact match against a single job ID, or an array to match any of several.
              oneOf:
                - type: string
                - type: array
                  items:
                    type: string
              example: job_abc123
        options:
          type: object
          properties:
            page:
              type: integer
              default: 1
              example: 1
            limit:
              type: integer
              default: 20
              maximum: 100
              description: Capped at 100 regardless of what you request.
              example: 20
            sort:
              type: object
              additionalProperties: true
              example: { createdAt: -1 }
            select:
              description: Fields to project — space-separated string or array of field names.
              oneOf:
                - type: string
                - type: array
                  items:
                    type: string
        isCountOnly:
          type: boolean
          description: 'If `true`, returns `{ "totalRecords": N }` instead of the paginated list.'
          example: false

    ListApplicationsRequestBody:
      type: object
      description: |
        `options` controls pagination/sorting. Every query is scoped to your workspace regardless of what
        you send — you cannot read another workspace's data through this endpoint.
      properties:
        query:
          type: object
          description: Filter object. Only `name` and `_id` are accepted — any other field is rejected with `422`.
          properties:
            name:
              type: string
              description: Case-insensitive substring match against the candidate's name.
              example: John
            _id:
              description: Exact match against a single application ID, or an array to match any of several.
              oneOf:
                - type: string
                - type: array
                  items:
                    type: string
              example: app_xyz789
        options:
          type: object
          properties:
            page:
              type: integer
              default: 1
              example: 1
            limit:
              type: integer
              default: 20
              maximum: 100
              description: Capped at 100 regardless of what you request.
              example: 20
            sort:
              type: object
              additionalProperties: true
              example: { createdAt: -1 }
            select:
              description: Fields to project — space-separated string or array of field names.
              oneOf:
                - type: string
                - type: array
                  items:
                    type: string
        isCountOnly:
          type: boolean
          description: 'If `true`, returns `{ "totalRecords": N }` instead of the paginated list.'
          example: false

    ListResponsesRequestBody:
      type: object
      description: |
        Pagination only — there is no `query` filter on this endpoint, since it always lists every
        response for the one application in the URL.
      properties:
        options:
          type: object
          properties:
            page:
              type: integer
              default: 1
              example: 1
            limit:
              type: integer
              default: 20
              maximum: 100
              description: Capped at 100 regardless of what you request.
              example: 20

    CountOnlyData:
      type: object
      properties:
        totalRecords:
          type: integer
          example: 42

    SkillItem:
      type: object
      required: [skill_name]
      properties:
        skill_name:
          type: string
          example: Node.js
        proficiency:
          type: string
          enum: [L1, L2, L3, L4, L5]
          example: L3
        preferred_tools:
          type: array
          items:
            type: string
        preferred_technologies:
          type: array
          items:
            type: string

    QuestionItem:
      type: object
      required: [title]
      properties:
        title:
          type: string
          example: Describe a time you optimized a slow query.
        topic_name:
          type: string
          example: Databases
        question_proficiency:
          type: string
          enum: [L1, L2, L3, L4, L5, 'Not specified']
          example: L3
        key_aspects_to_be_covered:
          type: array
          items:
            type: string
        skills_covered:
          type: array
          items:
            type: string
          example: [SQL]
        question_type:
          type: string
          example: video
        order:
          type: integer
          example: 1

    TopicItem:
      type: object
      required: [name]
      properties:
        name:
          type: string
          example: System Design
        skillsUsed:
          type: array
          items:
            type: string
        reason:
          type: string
        discussionMinutes:
          type: integer
          minimum: 1
          maximum: 60
          example: 15
        sampleQuestions:
          type: array
          items:
            type: string

    # ── Job request bodies ──────────────────────

    CreateJobRequest:
      type: object
      required: [title]
      description: |
        Creates the job as a **draft**, generating its description from `title` using Hyrefast's AI. Add
        skills and an interview configuration, then publish it separately. Only the listed fields are
        editable via this API — any other field is rejected with `422`. `description` cannot be set
        directly; it's always generated. To create a job from a JD document or URL instead — with the
        description (and other basic details) extracted rather than generated — use
        [`POST /jobs/create-from-jd`](#tag/Job-Creation/operation/createJobFromJd).
      properties:
        title:
          type: string
          description: Job title. The job description is generated from this.
          example: Senior Python Developer
        location:
          description: A single location, or an array for multi-city postings.
          oneOf:
            - type: string
            - type: array
              items:
                type: string
          example: Bangalore, India
        employment_type:
          type: string
          enum: [Full-time, Part-time, Contract, Internship, 'Not specified']
          example: Full-time
        work_mode:
          type: string
          enum: [On-site, Hybrid, Remote, 'Not specified']
          example: Remote
        work_type:
          type: string
          enum: [Full-time, Part-time, Contract, Internship, 'Not specified']
          example: Full-time
        salary_min:
          type: string
        salary_max:
          type: string
        min_experience:
          type: string
          example: '3'
        max_experience:
          type: string
          example: '7'
        last_date:
          type: string
          format: date
          description: Application deadline, as `YYYY-MM-DD`.
          example: '2026-09-15'

    CreateJobFromJdRequest:
      type: object
      required: [jd_doc]
      description: |
        Creates the job as a **draft**, extracting its title, description, and other basic details from
        `jd_doc`. Add skills and an interview configuration, then publish it separately. `jd_doc` is the
        only accepted field — every other field is rejected with `422`, since all job details come from
        the extraction. To create a job from a title instead — with the description generated rather than
        extracted — use [`POST /jobs/create`](#tag/Job-Creation/operation/createJob).
      properties:
        jd_doc:
          type: string
          format: uri
          description: |
            URL of the job description to extract from — either a document URL obtained from
            `POST /documents/upload` (`type: "jd"`), or a public JD posting URL.
          example: https://your-bucket.s3.amazonaws.com/workspaces/w1/external-uploads/jd/1699999999-a1b2c3.pdf

    UpdateJobRequest:
      type: object
      minProperties: 1
      description: |
        Updates an existing job. Only send the fields you want to change. Skills and interview
        configuration are **not** accepted here — use `PUT /jobs/{jobId}/skills`,
        `PUT /jobs/{jobId}/questions`, and `PUT /jobs/{jobId}/topics` instead. Only the listed fields are
        editable via this API — any other field (including `requirements`, `salary`, `education`,
        `min_qualification_needed`, `external_job_id`, and any field not listed below) is rejected with
        `422`.
      properties:
        title:
          type: string
        description:
          type: string
        location:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
        employment_type:
          type: string
          enum: [Full-time, Part-time, Contract, Internship, 'Not specified']
        work_mode:
          type: string
          enum: [On-site, Hybrid, Remote, 'Not specified']
        work_type:
          type: string
          enum: [Full-time, Part-time, Contract, Internship, 'Not specified']
        salary_min:
          type: string
        salary_max:
          type: string
        min_experience:
          type: string
        max_experience:
          type: string
        last_date:
          type: string
          format: date
          description: Application deadline, as `YYYY-MM-DD`.
          example: '2026-09-15'
        jd_doc:
          type: string
          format: uri
          description: |
            URL of the job description document, obtained from
            `POST /documents/upload` (`type: "jd"`).

    UpdateSkillsRequest:
      type: object
      minProperties: 1
      description: |
        **Full replace** of the skills sub-resource. Any bucket you omit is cleared, not left unchanged —
        send all three buckets if you want to keep existing values in one of them.
      properties:
        must_have_skills:
          type: array
          items:
            $ref: '#/components/schemas/SkillItem'
        good_to_have_skills:
          type: array
          items:
            $ref: '#/components/schemas/SkillItem'
        bonus_skills:
          type: array
          items:
            $ref: '#/components/schemas/SkillItem'

    UpdateQuestionsRequest:
      type: object
      required: [questions]
      description: |
        **Full replace** of the job's interview question bank. Previously-referenced question documents
        are left intact (not deleted, since past applications may reference them) — only the job's pointer
        to them changes. Send an empty array to clear all questions.
      properties:
        questions:
          type: array
          items:
            $ref: '#/components/schemas/QuestionItem'

    UpdateTopicsRequest:
      type: object
      minProperties: 1
      description: |
        **Full replace** of the job's focus/avoid discussion-topic guidance. Send both properties if you
        want to keep existing values in one of them — an omitted property is cleared, not left unchanged.
      properties:
        topicsToFocus:
          type: array
          items:
            $ref: '#/components/schemas/TopicItem'
        topicsToAvoid:
          type: array
          items:
            type: string

    # ── Application request bodies ──────────────

    CreateApplicationRequest:
      type: object
      required: [job, email, name, number]
      description: |
        `job`, `email`, `name`, and `number` are required. `resume` is optional. Any other field is
        rejected with `422`.
      properties:
        job:
          type: string
          description: ID of a job in your workspace.
          example: job_abc123
        email:
          type: string
          format: email
          description: Used to find or create the candidate.
          example: john@example.com
        name:
          type: string
          example: John Doe
        number:
          type: string
          example: '+919876543210'
        resume:
          type: string
          format: uri
          description: |
            URL of the candidate's resume, obtained from `POST /documents/upload` (`type: "resume"`).
          example: https://your-bucket.s3.amazonaws.com/workspaces/w1/external-uploads/resumes/1699999999-d4e5f6.pdf

    UpdateApplicationRequest:
      type: object
      required: [name]
      description: |
        Only the candidate's `name` is editable via this API for now. Any other field is rejected with
        `422`.
      properties:
        name:
          type: string
          example: John Doe

    # ── Response data schemas ───────────────────

    UploadDocumentData:
      type: object
      properties:
        url:
          type: string
          format: uri
          description: Public URL of the uploaded file. Pass this as `resume` or `jd_doc` on the create calls.
          example: https://your-bucket.s3.amazonaws.com/workspaces/w1/external-uploads/resumes/1699999999-d4e5f6.pdf
        key:
          type: string
          description: S3 object key.
        fileName:
          type: string
          description: Original filename as uploaded.
          example: resume.pdf
        fileSize:
          type: integer
          example: 245678
        mimeType:
          type: string
          example: application/pdf
        type:
          type: string
          enum: [resume, jd]

    JobData:
      type: object
      properties:
        id:
          type: string
          example: job_abc123
        title:
          type: string
          example: Senior Python Developer
        description:
          type: string
        location:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
        employment_type:
          type: string
        work_mode:
          type: string
        work_type:
          type: string
        jd_doc:
          type: string
          format: uri
          nullable: true
          description: URL of the job description document, if one was provided.
        publicationStatus:
          type: string
          enum:
            [
              draft,
              published,
              hiring_in_progress,
              hiring_completed,
              closed,
              completed,
            ]
          example: draft
        status:
          type: string
          enum:
            [
              draft,
              published,
              hiring_in_progress,
              hiring_completed,
              closed,
              completed,
            ]
          example: draft
        application_count:
          type: integer
          example: 0
        createdAt:
          type: string
          format: date-time
          example: 2026-08-01T10:00:00Z
        updatedAt:
          type: string
          format: date-time
          example: 2026-08-01T10:00:00Z

    JobConversationModeData:
      type: object
      properties:
        id:
          type: string
          example: job_abc123
        interviewModes:
          type: object
          properties:
            standard:
              type: boolean
              example: true
            conversation:
              type: boolean
              nullable: true
              example: true

    JobSkillsData:
      type: object
      properties:
        id:
          type: string
          example: job_abc123
        jd_structured_skills:
          type: object
          properties:
            must_have_skills:
              type: array
              items:
                $ref: '#/components/schemas/SkillItem'
            good_to_have_skills:
              type: array
              items:
                $ref: '#/components/schemas/SkillItem'
            bonus_skills:
              type: array
              items:
                $ref: '#/components/schemas/SkillItem'

    SkillsGenerationJob:
      type: object
      properties:
        jobId:
          type: string
          description: |
            ID of this generation run — not the job's own ID. Pass it to
            `GET /jobs/skills/generate/status/{jobId}` to poll it.
          example: 8f14e45f-ceea-467e-bd3f-e0e3e4a5b7c1
        status:
          type: string
          enum: [queued, processing, succeeded, failed]
          example: queued
        pollAfterMs:
          type: integer
          description: Suggested delay, in milliseconds, before your first status poll.
          example: 2000

    SkillsGenerationResult:
      type: object
      description: Populated on the status response once generation has `succeeded`.
      properties:
        jobId:
          type: string
          description: ID of the job the skills were generated for (its own ID, not the generation run's).
          example: job_abc123
        job_title:
          type: string
          example: Senior Python Developer
        structured_extraction:
          type: object
          properties:
            must_have_skills:
              type: array
              items:
                $ref: '#/components/schemas/SkillItem'
            good_to_have_skills:
              type: array
              items:
                $ref: '#/components/schemas/SkillItem'
            bonus_skills:
              type: array
              items:
                $ref: '#/components/schemas/SkillItem'
        skillsSavedAt:
          type: string
          format: date-time

    SkillsGenerationStatus:
      type: object
      properties:
        jobId:
          type: string
          description: ID of this generation run.
          example: 8f14e45f-ceea-467e-bd3f-e0e3e4a5b7c1
        status:
          type: string
          enum: [queued, processing, succeeded, failed]
          example: succeeded
        stage:
          type: string
          nullable: true
          example: completed
        message:
          type: string
          nullable: true
          example: Skill extraction completed.
        pollAfterMs:
          type: integer
          description: Suggested delay, in milliseconds, before your next status poll.
          example: 2000
        error:
          type: string
          nullable: true
          description: Populated only when `status` is `failed`.
        result:
          nullable: true
          description: |
            Populated once `status` is `succeeded`; `null` while `queued`/`processing`, and on `failed`.
            The generated skills are also written directly to the job's `jd_structured_skills` field, so
            you can alternatively re-fetch the job instead of reading this.
          allOf:
            - $ref: '#/components/schemas/SkillsGenerationResult'
        createdAt:
          type: string
          format: date-time
          nullable: true
        startedAt:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true

    JobQuestionsData:
      type: object
      properties:
        id:
          type: string
          example: job_abc123
        title:
          type: string
        questions:
          type: array
          items:
            $ref: '#/components/schemas/QuestionItem'
        updatedAt:
          type: string
          format: date-time

    QuestionsGenerationJob:
      type: object
      properties:
        jobId:
          type: string
          description: |
            ID of this generation run — not the job's own ID. Pass it to
            `GET /jobs/questions/generate/status/{jobId}` to poll it.
          example: 3c2f9d6a-1b4e-4f8a-9c3d-2e5f7a8b9c0d
        status:
          type: string
          enum: [queued, processing, succeeded, failed]
          example: queued
        pollAfterMs:
          type: integer
          description: Suggested delay, in milliseconds, before your first status poll.
          example: 2000

    QuestionsGenerationResult:
      type: object
      description: |
        Populated on the status response once generation has `succeeded`. Unlike skill generation, this
        result is **not** saved anywhere automatically — to keep these questions, pass `questions` to
        `PUT /jobs/{jobId}/questions` yourself.
      properties:
        questions:
          type: array
          items:
            $ref: '#/components/schemas/QuestionItem'
          description: |
            Generated questions. `order` and `question_type` aren't populated by generation — if you persist
            this list via `PUT /jobs/{jobId}/questions`, set `order` from each item's array index first, or
            every item will default to `order: 1` there.
        skillCoverageReport:
          type: object
          nullable: true
          description: Diagnostic report on how well the generated questions cover the job's required skills.
        context:
          type: object
          properties:
            jobTitle:
              type: string
            jobDescription:
              type: string
            employmentType:
              type: string
            requirements:
              type: array
              items:
                type: string
        generatedAt:
          type: string
          format: date-time
        configUsed:
          type: object
          nullable: true
          properties:
            model:
              type: string
            provider:
              type: string
        workflowDiagnostics:
          type: object
          nullable: true

    QuestionsGenerationStatus:
      type: object
      properties:
        jobId:
          type: string
          description: ID of this generation run.
          example: 3c2f9d6a-1b4e-4f8a-9c3d-2e5f7a8b9c0d
        status:
          type: string
          enum: [queued, processing, succeeded, failed]
          example: succeeded
        stage:
          type: string
          nullable: true
          example: completed
        message:
          type: string
          nullable: true
          example: Interview question generation completed.
        pollAfterMs:
          type: integer
          description: Suggested delay, in milliseconds, before your next status poll.
          example: 2000
        error:
          type: string
          nullable: true
          description: Populated only when `status` is `failed`.
        result:
          nullable: true
          description: Populated once `status` is `succeeded`; `null` while `queued`/`processing`, and on `failed`.
          allOf:
            - $ref: '#/components/schemas/QuestionsGenerationResult'
        createdAt:
          type: string
          format: date-time
          nullable: true
        startedAt:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true

    JobTopicsData:
      type: object
      properties:
        id:
          type: string
          example: job_abc123
        title:
          type: string
        topics:
          type: object
          properties:
            topicsToFocus:
              type: array
              items:
                $ref: '#/components/schemas/TopicItem'
            topicsToAvoid:
              type: array
              items:
                type: string
        updatedAt:
          type: string
          format: date-time

    TopicsGenerationJob:
      type: object
      properties:
        jobId:
          type: string
          description: |
            ID of this generation run — not the job's own ID. Pass it to
            `GET /jobs/topics/generate/status/{jobId}` to poll it.
          example: 5e6f7a8b-9c0d-4e1f-8a2b-3c4d5e6f7a8b
        status:
          type: string
          enum: [queued, processing, succeeded, failed]
          example: queued
        pollAfterMs:
          type: integer
          description: Suggested delay, in milliseconds, before your first status poll.
          example: 2000

    TopicsGenerationResult:
      type: object
      description: |
        Populated on the status response once generation has `succeeded`. Unlike skill generation, this
        result is **not** saved anywhere automatically — to keep these topics, pass `topicsToFocus` to
        `PUT /jobs/{jobId}/topics` yourself.
      properties:
        topicsToFocus:
          type: array
          items:
            $ref: '#/components/schemas/TopicItem'
          description: |
            Normalized topics, parsed server-side from the AI's response — already shaped for
            `PUT /jobs/{jobId}/topics`.

    TopicsGenerationStatus:
      type: object
      properties:
        jobId:
          type: string
          description: ID of this generation run.
          example: 5e6f7a8b-9c0d-4e1f-8a2b-3c4d5e6f7a8b
        status:
          type: string
          enum: [queued, processing, succeeded, failed]
          example: succeeded
        stage:
          type: string
          nullable: true
          example: completed
        message:
          type: string
          nullable: true
          example: AI Labs config analysis.topics completed.
        pollAfterMs:
          type: integer
          description: Suggested delay, in milliseconds, before your next status poll.
          example: 2000
        error:
          type: string
          nullable: true
          description: Populated only when `status` is `failed`.
        result:
          nullable: true
          description: Populated once `status` is `succeeded`; `null` while `queued`/`processing`, and on `failed`.
          allOf:
            - $ref: '#/components/schemas/TopicsGenerationResult'
        createdAt:
          type: string
          format: date-time
          nullable: true
        startedAt:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true

    JobListData:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/JobData'
        currentPage:
          type: integer
          example: 1
        perPage:
          type: integer
          example: 20
        itemCount:
          type: integer
          example: 1
        pageCount:
          type: integer
          example: 1

    ApplicationData:
      type: object
      properties:
        id:
          type: string
          example: app_xyz789
        candidate:
          type: object
          properties:
            name:
              type: string
              example: John Doe
            email:
              type: string
              format: email
              example: john@example.com
            mobileNo:
              type: string
        job:
          type: object
          properties:
            id:
              type: string
              example: job_abc123
            title:
              type: string
              example: Senior Python Developer
        resume:
          type: string
          format: uri
          nullable: true
          description: URL of the candidate's resume, if one was provided.
        status:
          type: string
          example: interview_link_not_sent
        shortlisted:
          type: boolean
          example: false
        createdAt:
          type: string
          format: date-time
          example: 2026-08-01T10:05:00Z
        updatedAt:
          type: string
          format: date-time
          example: 2026-08-01T10:05:00Z

    ApplicationListData:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ApplicationData'
        currentPage:
          type: integer
          example: 1
        perPage:
          type: integer
          example: 20
        itemCount:
          type: integer
          example: 1
        pageCount:
          type: integer
          example: 1

    InterviewInvitationData:
      type: object
      properties:
        interviewId:
          type: string
          example: ivw_def456
        applicationId:
          type: string
          example: app_xyz789
        status:
          type: string
          example: sent
        created_at:
          type: string
          format: date-time
          example: 2026-08-01T10:10:00Z

    InterviewLinkData:
      type: object
      properties:
        interviewLink:
          type: string
          description: The candidate's private interview link.
          example: https://hyrefast.ai/interview/ivw_def456?token=abc123

    # ── Response data schemas ───────────────────

    ResponseDurations:
      type: object
      nullable: true
      properties:
        video_duration:
          type: number
          nullable: true
          description: Seconds.
          example: 42.5
        audio_duration:
          type: number
          nullable: true
          description: Seconds.
          example: 42.5
        response_latency:
          type: number
          nullable: true
          description: Seconds between the question being shown and the candidate starting to answer.
          example: 1.2
        response_onset_latency:
          type: number
          nullable: true
          example: 0.8

    ResponseData:
      type: object
      properties:
        id:
          type: string
          example: rsp_ghi012
        questionNumber:
          type: integer
          example: 1
        questionText:
          type: string
          example: Describe a time you optimized a slow query.
        responseText:
          type: string
          description: Text answer, for text-based questions. Empty for audio/video answers.
        transcriptionStatus:
          type: string
          enum:
            [pending, processing, processing_retry, completed, failed, skipped]
          description: |
            Transcription runs asynchronously and can still be in progress after the interview itself is
            complete — poll this endpoint until it reaches `completed` (or `failed`/`skipped`).
          example: completed
        transcriptionMethod:
          type: string
          nullable: true
          enum: [whisper, browser, gemini, skipped, none]
          example: whisper
        transcriptionText:
          type: string
          nullable: true
          description: Only populated once `transcriptionStatus` is `completed`; `null` otherwise.
          example: So there was this one time where the query was taking...
        responseDuration:
          type: number
          nullable: true
          description: Total seconds spent on this answer.
          example: 42.5
        durations:
          $ref: '#/components/schemas/ResponseDurations'
        audioUrl:
          type: string
          format: uri
          nullable: true
          description: |
            Presigned S3 URL for the recorded audio, **valid for 1 hour** from when you called this
            endpoint. `null` if no audio was captured for this answer. Re-call this endpoint for a fresh
            URL once it expires — don't cache it.
          example: https://your-bucket.s3.amazonaws.com/workspaces/w1/.../audio/final.webm?X-Amz-Signature=...
        videoUrl:
          type: string
          format: uri
          nullable: true
          description: |
            Presigned S3 URL for the recorded video, **valid for 1 hour** from when you called this
            endpoint. `null` if no video was captured for this answer. Re-call this endpoint for a fresh
            URL once it expires — don't cache it.
          example: https://your-bucket.s3.amazonaws.com/workspaces/w1/.../video/final.webm?X-Amz-Signature=...
        isSkipped:
          type: boolean
          example: false
        createdAt:
          type: string
          format: date-time
          example: 2026-08-20T10:15:00Z
        updatedAt:
          type: string
          format: date-time
          example: 2026-08-20T10:16:30Z

    ResponseListData:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ResponseData'
        currentPage:
          type: integer
          example: 1
        perPage:
          type: integer
          example: 20
        itemCount:
          type: integer
          example: 1
        pageCount:
          type: integer
          example: 1

    # ── Webhook request bodies ──────────────────

    CreateWebhookRequest:
      type: object
      required: [name, url]
      description: |
        Registers your webhook URL. A workspace may register only one — this is rejected with `422` if
        one already exists. There is no `events` field: a registered webhook receives every supported
        event. `name` and `url` are the only accepted fields — any other field is rejected with `422`.
      properties:
        name:
          type: string
          description: A human-friendly label for your own reference.
          example: Production ATS sync
        url:
          type: string
          format: uri
          description: HTTPS (or HTTP) endpoint that will receive the POSTed event payload.
          example: https://api.yourats.com/hooks/hyrefast

    UpdateWebhookRequest:
      type: object
      minProperties: 1
      description: |
        Only `name` and `url` are editable via this API — any other field (including `status`) is
        rejected with `422`. Only send the field(s) you want to change.
      properties:
        name:
          type: string
        url:
          type: string
          format: uri

    # ── Webhook response data schemas ───────────

    WebhookData:
      type: object
      properties:
        id:
          type: string
          example: whk_qrs321
        workspace:
          type: string
          example: ws_123456
        name:
          type: string
          example: Production ATS sync
        url:
          type: string
          example: https://api.yourats.com/hooks/hyrefast
        status:
          type: string
          enum: [active, disabled]
          example: active
        lastTriggeredAt:
          type: [string, 'null']
          format: date-time
          example: null
        createdAt:
          type: string
          format: date-time
          example: 2026-08-01T10:00:00Z
        updatedAt:
          type: string
          format: date-time
          example: 2026-08-01T10:00:00Z

    WebhookCreateData:
      type: object
      description: |
        Same fields as `WebhookData`, plus the signing `secret` — shown **only** in this response. Store
        it securely; there is no way to retrieve it again later (you'd need to delete and re-register).
      properties:
        id:
          type: string
          example: whk_qrs321
        workspace:
          type: string
          example: ws_123456
        name:
          type: string
          example: Production ATS sync
        url:
          type: string
          example: https://api.yourats.com/hooks/hyrefast
        status:
          type: string
          enum: [active, disabled]
          example: active
        secret:
          type: string
          example: whsec_5f3a9c1e8b2d4f6a7c0e1b3d5f7a9c1e8b2d4f6a7c0e1b3d5f7a9c1e8b2d4f6a
        lastTriggeredAt:
          type: [string, 'null']
          format: date-time
          example: null
        createdAt:
          type: string
          format: date-time
          example: 2026-08-01T10:00:00Z
        updatedAt:
          type: string
          format: date-time
          example: 2026-08-01T10:00:00Z

  # ─────────────────────────────────────────────
  # Reusable responses
  # ─────────────────────────────────────────────
  responses:
    NotFound:
      description: The referenced `jobId`/`applicationId` doesn't exist or isn't part of your workspace.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NotFoundEnvelope'
    Unauthorized:
      description: Missing, invalid, revoked, or expired API key.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UnauthorizedEnvelope'
    RateLimited:
      description: Rate limit exceeded (60 requests / 10 minutes per API key).
      headers:
        RateLimit-Limit:
          schema:
            type: integer
            example: 60
        RateLimit-Remaining:
          schema:
            type: integer
            example: 0
        RateLimit-Reset:
          schema:
            type: integer
            example: 600
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RateLimitEnvelope'
    InternalServerError:
      description: Unexpected server error; no stack trace is exposed.
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: string
                example: INTERNAL_SERVER_ERROR
              message:
                type: string
              data:
                example: null

# ─────────────────────────────────────────────
# Tags
# ─────────────────────────────────────────────
tags:
  - name: Documents
    description: |
      Upload resume and job description files ahead of creating an application or job, then reference
      the returned URL in the create call.
  - name: Job Creation
    description: |
      Create a job as a draft, either from a title (Hyrefast generates the description) or from a JD
      document/URL (Hyrefast extracts it). Add skills, questions or topics, then publish separately.
  - name: Skills
    description: |
      Set or generate the must-have, good-to-have, and bonus skills for a job. At least one must-have
      skill is required before the job can be published.
  - name: Questions
    description: Set or generate the interview question bank for a job.
  - name: Topics
    description: |
      Set or generate the focus/avoid discussion topics for a job. At least one topic is required
      before conversation-mode interviews can be enabled.
  - name: Publishing
    description: Publish a job once it has at least one must-have skill. Questions and topics are optional.
  - name: Conversation Mode
    description: Enable or disable conversation-mode interviews for a job.
  - name: Job Management
    description: List, update, and delete jobs in your workspace.
  - name: Applications
    description: Submit and manage candidate applications against existing jobs.
  - name: Interviews
    description: Send or retrieve interview invitation links.
  - name: Responses
    description: |
      Read back a candidate's interview responses once they've completed the interview — the transcript
      for each question, plus time-limited signed URLs for the recorded audio/video.
  - name: Webhooks
    description: |
      Register a URL to receive real-time event notifications instead of polling. Registration is
      **URL-based, not event-based**: a workspace may register only one webhook URL, and that single
      registration receives every supported event. A second registration attempt while one is already
      active is rejected — update or delete the existing one first.

      **Supported events**

      | Event | Fired when |
      |---|---|
      | `interview_completed` | A candidate completed their interview |

      <!--
      Other supported events, hidden for now:
      | `application_resume_scored` | A candidate's resume has been scored against the job |
      | `interview_link_sent` | An interview invitation email was sent to a candidate |
      | `interview_started` | A candidate started their interview |
      -->

      **Delivery**

      Each event is `POST`ed to your registered URL as:

      ```json
      {
        "id": "evt_9c1c2e...",
        "event": "interview_completed",
        "createdAt": "2026-08-01T10:10:00Z",
        "data": { "...": "resource ids and metadata describing the event" }
      }
      ```

      with these request headers:

      | Header | Description |
      |---|---|
      | `Content-Type` | Always `application/json` |
      | `X-Hyrefast-Event` | The event name, e.g. `interview_completed` |
      | `X-Hyrefast-Timestamp` | Unix ms timestamp the request was signed at |
      | `X-Hyrefast-Signature` | HMAC-SHA256 signature, hex-encoded — see below |

      **Verifying the signature**

      Compute `HMAC-SHA256(secret, "${timestamp}.${rawRequestBody}")` (hex digest) using the `secret`
      returned once when you created the webhook, and compare it to `X-Hyrefast-Signature` using a
      constant-time comparison. Use `X-Hyrefast-Timestamp` to reject stale requests and prevent replay.
      The `secret` is shown only in the response to `POST /webhook-subscription/create` — store it
      securely; it cannot be retrieved again later.

      **Retries**

      A failed delivery (non-2xx response, or no response within 10s) is retried up to 5 times with
      exponential backoff (5s, 10s, 20s, 40s, 80s). Because of retries, your endpoint may receive the
      same `id` more than once — make handling idempotent (e.g. skip an `id` you've already processed).

      **Example: handling `interview_completed` (Node.js / Express)**

      A minimal handler that verifies the signature, then reacts to the event. The key gotcha: signature
      verification needs the *raw* request body bytes, not the JSON-parsed object — capture it with
      `express.json({ verify })` before anything re-serializes the body.

      ```javascript
      const express = require('express');
      const crypto = require('crypto');

      const app = express();
      const WEBHOOK_SECRET = process.env.HYREFAST_WEBHOOK_SECRET; // the `secret` from POST /webhook-subscription/create

      // Capture the raw body alongside the parsed one - required for signature verification.
      app.use(express.json({
        verify: (req, res, buf) => { req.rawBody = buf; },
      }));

      function isValidSignature(req) {
        const timestamp = req.header('X-Hyrefast-Timestamp');
        const signature = req.header('X-Hyrefast-Signature');
        if (!timestamp || !signature) return false;

        // Reject requests older than 5 minutes to prevent replay.
        if (Math.abs(Date.now() - Number(timestamp)) > 5 * 60 * 1000) return false;

        const expected = crypto
          .createHmac('sha256', WEBHOOK_SECRET)
          .update(`${timestamp}.${req.rawBody}`)
          .digest('hex');

        const expectedBuf = Buffer.from(expected, 'hex');
        const actualBuf = Buffer.from(signature, 'hex');
        return (
          expectedBuf.length === actualBuf.length &&
          crypto.timingSafeEqual(expectedBuf, actualBuf)
        );
      }

      app.post('/webhooks/hyrefast', (req, res) => {
        if (!isValidSignature(req)) {
          return res.status(401).json({ error: 'Invalid signature' });
        }

        // Acknowledge immediately - Hyrefast times out (and retries) after 10s.
        // Do any slow work (DB writes, other API calls) after responding, not before.
        res.status(200).json({ received: true });

        const { id, event, data } = req.body;
        if (event === 'interview_completed') {
          const { applicationId, candidateId, jobId, completedAt } = data;
          console.log(`Interview completed for application ${applicationId}`, {
            candidateId,
            jobId,
            completedAt,
          });
          // e.g. mark the candidate as "interview complete" in your ATS,
          // keyed by applicationId/candidateId. Use `id` to de-duplicate retries.
        }
      });

      app.listen(3000);
      ```

      **Example payload delivered to your endpoint** for `interview_completed`:

      ```json
      {
        "id": "evt_9c1c2e4a-1b2d-4e5f-8a9b-0c1d2e3f4a5b",
        "event": "interview_completed",
        "createdAt": "2026-08-01T10:10:00Z",
        "data": {
          "applicationId": "app_xyz789",
          "candidateId": "cand_abc123",
          "jobId": "job_abc123",
          "completedAt": "2026-08-01T10:09:45Z"
        }
      }
      ```

      **Expected response**: any `2xx` status code within 10 seconds counts as a successful delivery -
      the response body isn't inspected, so `{ "received": true }` is just a convention, not a
      requirement. Anything else (4xx/5xx, timeout, connection error) is treated as a failure and retried.

# ─────────────────────────────────────────────
# Paths
# ─────────────────────────────────────────────
paths:
  # ── 0. Upload Document ───────────────────────
  /external/api/v1/documents/upload:
    post:
      operationId: uploadDocument
      tags: [Documents]
      summary: Upload a resume or JD document
      description: |
        Uploads a resume or job description file to Hyrefast's S3 bucket and returns its URL. Use that
        URL as `resume` on [`POST /applications/create`](#tag/Applications/operation/createApplication)
        or as `jd_doc` on [`POST /jobs/create-from-jd`](#tag/Job-Creation/operation/createJobFromJd).

        Accepts PDF, DOC, and DOCX files up to 10MB, sent as `multipart/form-data`.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, type]
              properties:
                file:
                  type: string
                  format: binary
                  description: The resume or JD file (PDF, DOC, or DOCX; max 10MB).
                type:
                  type: string
                  enum: [resume, jd]
                  description: What kind of document this is — determines where it's stored.
      responses:
        '200':
          description: File uploaded successfully.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/UploadDocumentData'
              examples:
                success:
                  value:
                    status: SUCCESS
                    message: File uploaded successfully
                    data:
                      url: https://your-bucket.s3.amazonaws.com/workspaces/w1/external-uploads/resumes/1699999999-d4e5f6.pdf
                      key: workspaces/w1/external-uploads/resumes/1699999999-d4e5f6.pdf
                      fileName: resume.pdf
                      fileSize: 245678
                      mimeType: application/pdf
                      type: resume
        '400':
          description: Missing file, missing/invalid `type`, file too large, or an unsupported file type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'
      x-codeSamples:
        - lang: cURL
          source: |
            curl -X POST "https://api.hyrefast.ai/external/api/v1/documents/upload" \
              -H "X-API-Key: YOUR_API_KEY" \
              -F "file=@/path/to/resume.pdf" \
              -F "type=resume"
        - lang: JavaScript
          source: |
            const form = new FormData();
            form.append('file', fileBlob, 'resume.pdf');
            form.append('type', 'resume');

            const response = await fetch(`${BASE_URL}/external/api/v1/documents/upload`, {
              method: 'POST',
              headers: { 'X-API-Key': API_KEY },
              body: form,
            });
            const { data } = await response.json();
            // data.url -> pass as `resume` on POST /applications/create
        - lang: Python
          source: |
            import requests

            with open('resume.pdf', 'rb') as f:
                response = requests.post(
                    f"{BASE_URL}/external/api/v1/documents/upload",
                    headers={"X-API-Key": API_KEY},
                    files={"file": f},
                    data={"type": "resume"},
                )
            data = response.json()["data"]
            # data["url"] -> pass as `resume` on POST /applications/create

  # ── 1. Create Job ────────────────────────────
  /external/api/v1/jobs/create:
    post:
      operationId: createJob
      tags: [Job Creation]
      summary: Create from a title
      description: |
        Creates a new **draft** job in the workspace associated with your API key, generating its
        description from `title` with Hyrefast's AI. To create from a JD document or URL instead, use
        [`POST /jobs/create-from-jd`](#tag/Job-Creation/operation/createJobFromJd).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateJobRequest'
            examples:
              full_example:
                summary: Full example
                value:
                  title: Senior Python Developer
                  location: Bangalore, India
                  employment_type: Full-time
                  work_mode: Remote
                  min_experience: '3'
                  max_experience: '7'
                  salary_min: '1000000'
                  salary_max: '1500000'
                  last_date: '2026-09-15'
      responses:
        '200':
          description: Job created successfully (as a draft), with an AI-generated description.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/JobData'
              examples:
                success:
                  value:
                    status: SUCCESS
                    message: Your request is successfully executed
                    data:
                      id: job_abc123
                      title: Senior Python Developer
                      publicationStatus: draft
                      status: draft
                      createdAt: 2026-08-01T10:00:00Z
        '422':
          description: Validation error — missing or invalid job fields, or description generation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'
      x-codeSamples:
        - lang: cURL
          source: |
            curl -X POST "https://api.hyrefast.ai/external/api/v1/jobs/create" \
              -H "X-API-Key: YOUR_API_KEY" \
              -H "Content-Type: application/json" \
              -d '{
                "title": "Senior Python Developer",
                "employment_type": "Full-time",
                "location": "Bangalore, India"
              }'
        - lang: JavaScript
          source: |
            const response = await fetch(`${BASE_URL}/external/api/v1/jobs/create`, {
              method: 'POST',
              headers: {
                'X-API-Key': API_KEY,
                'Content-Type': 'application/json',
              },
              body: JSON.stringify({
                title: 'Senior Python Developer',
                employment_type: 'Full-time',
                location: 'Bangalore, India',
              }),
            });
            const { data } = await response.json();
        - lang: Python
          source: |
            import requests

            response = requests.post(
                f"{BASE_URL}/external/api/v1/jobs/create",
                headers={"X-API-Key": API_KEY},
                json={
                    "title": "Senior Python Developer",
                    "employment_type": "Full-time",
                    "location": "Bangalore, India",
                },
            )
            data = response.json()["data"]

  # ── 1b. Create Job From JD ───────────────────
