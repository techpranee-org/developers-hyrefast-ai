  # ── 5b. Update Job Topics ─────────────────────
  /external/api/v1/jobs/{jobId}/topics:
    put:
      operationId: updateJobTopics
      tags: [Topics]
      summary: Set topics
      description: |
        Sets (full replace) the job's focus/avoid discussion-topic guidance. Send both properties if you
        want to keep existing values in one of them — an omitted property is cleared, not left unchanged.
        The question bank is a separate sub-resource — see `PUT /jobs/{jobId}/questions`.
      parameters:
        - $ref: '#/components/parameters/JobId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTopicsRequest'
            examples:
              example:
                value:
                  topicsToFocus:
                    - name: System Design
                      discussionMinutes: 15
                  topicsToAvoid: [Salary negotiation]
      responses:
        '200':
          description: Topics updated successfully.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/JobTopicsData'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Validation error — at least one of `topicsToFocus` / `topicsToAvoid` is required, or a topic is missing its `name`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'
      x-codeSamples:
        - lang: cURL
          source: |
            curl -X PUT "https://api.hyrefast.ai/external/api/v1/jobs/job_abc123/topics" \
              -H "X-API-Key: YOUR_API_KEY" \
              -H "Content-Type: application/json" \
              -d '{ "topicsToFocus": [{ "name": "System Design", "discussionMinutes": 15 }] }'
        - lang: JavaScript
          source: |
            const response = await fetch(
              `${BASE_URL}/external/api/v1/jobs/${JOB_ID}/topics`,
              {
                method: 'PUT',
                headers: { 'X-API-Key': API_KEY, 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  topicsToFocus: [{ name: 'System Design', discussionMinutes: 15 }],
                }),
              },
            );
            const { data } = await response.json();
        - lang: Python
          source: |
            import requests

            response = requests.put(
                f"{BASE_URL}/external/api/v1/jobs/{JOB_ID}/topics",
                headers={"X-API-Key": API_KEY},
