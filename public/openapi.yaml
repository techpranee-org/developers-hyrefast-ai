          source: |
            curl -X GET "https://api.hyrefast.ai/external/api/v1/jobs/topics/generate/status/5e6f7a8b-9c0d-4e1f-8a2b-3c4d5e6f7a8b" \
              -H "X-API-Key: YOUR_API_KEY"
        - lang: JavaScript
          source: |
            const response = await fetch(
